name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            frontend: false
          - os: ubuntu-latest
            python: '3.12'
            frontend: true
          - os: macos-latest
            python: '3.12'
            frontend: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON: python3
    steps:
      - name: Check out source without persisted write credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library synthetic tests
        run: python3 -B -m unittest discover -v
      - name: Set up Node for DOM and API integration tests
        if: matrix.frontend
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Synthetic DOM and local API integration
        if: matrix.frontend
        run: node scripts/test_frontend.mjs
      - name: Check the public source release set
        run: python3 -B scripts/release_check.py
