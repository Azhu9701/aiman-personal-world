<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>微信历史 · AIMAN Personal World</title>
  <style>
    :root{--green:#07a95b;--green-dark:#078346;--green-soft:#e6f5eb;--ink:#252b29;--muted:#7b8580;--line:#e4e8e5;--paper:#f5f6f5;--rail:#292d2b;--sidebar:#f9faf9;--bubble:#a5e978;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button,a,input{-webkit-tap-highlight-color:transparent}
    button{color:inherit;cursor:pointer}
    button{border:0;background:none}
    button:disabled{cursor:default;opacity:.48}
    button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #39aa75;outline-offset:3px}
    input{min-width:0}
    svg{display:block;flex-shrink:0}
    .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .app{display:grid;grid-template-columns:68px 312px minmax(0,1fr);height:100%;height:100dvh;min-height:0}
    .rail{display:flex;flex-direction:column;align-items:center;gap:9px;padding:25px 0 18px;background:var(--rail);color:#9da7a1;z-index:4}
    .brand{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#17bd69;color:white;margin-bottom:28px;box-shadow:0 4px 14px #0002}
    .brand .icon{width:26px;height:26px;stroke-width:1.8}
    .rail-button{width:44px;height:44px;display:grid;place-items:center;border-radius:11px;position:relative;transition:background .15s,color .15s}
    .rail-button:hover{background:#ffffff10;color:white}
    .rail-button.active{color:#42d786;background:#ffffff0a}
    .rail-button.active:before{content:"";position:absolute;left:-12px;width:3px;height:22px;border-radius:0 2px 2px 0;background:#42d786}
    .rail-button .icon{width:23px;height:23px}
    .rail-spacer{flex:1}
    .rail-divider{width:23px;height:1px;background:#ffffff12;margin:8px 0}
    .connection-light{width:7px;height:7px;border-radius:50%;background:#e0aa4d;box-shadow:0 0 0 4px #e0aa4d10;margin-top:8px}
    .connection-light.ready{background:#43d185;box-shadow:0 0 0 4px #43d18513}
    .sidebar{min-height:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-heading{padding:27px 21px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .sidebar-heading h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.4px}
    .account-label{margin-top:5px;font-size:11px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .icon-button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:#757f79;flex-shrink:0}
    .icon-button:hover{background:#e9edea;color:#303b34}
    .search-box{margin:0 17px;display:flex;align-items:center;gap:8px;background:#ecefed;border:1px solid transparent;border-radius:8px;padding:0 10px;height:37px;transition:border-color .15s,background .15s}
    .search-box:focus-within{background:white;border-color:#7dc79d}
    .search-box .icon{width:16px;height:16px;color:#8b958f}
    .search-box input{width:100%;border:0;outline:none!important;background:transparent;font-size:12px;color:var(--ink);height:100%}
    .search-box input::placeholder{color:#8a938d}
    .search-clear{display:grid;place-items:center;padding:3px;border-radius:4px;color:#87928a}
    .search-clear:hover{background:#dae0dc;color:#444}
    .search-clear .icon{width:14px;height:14px}
    .search-modes{display:flex;gap:19px;padding:16px 23px 0;border-bottom:1px solid var(--line)}
    .mode-button{position:relative;padding:0 0 12px;color:#959d97;font-size:12px}
    .mode-button.active{color:var(--green-dark);font-weight:600}
    .mode-button.active:after{content:"";position:absolute;height:2px;border-radius:2px;background:var(--green);bottom:-1px;left:0;right:0}
    .filters{display:flex;gap:5px;padding:14px 18px 7px}
    .filter-button{padding:5px 11px;border-radius:6px;color:#818b84;font-size:11px}
    .filter-button.active{background:#e6ede8;color:#314e3a;font-weight:600}
    .filter-button:hover{background:#e9edea}
    .scope-chip{margin:13px 18px 5px;background:#eaf2ec;border-radius:6px;padding:6px 8px;display:flex;align-items:center;gap:7px;color:#537260;font-size:11px}
    .scope-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .scope-chip button{display:grid;place-items:center;padding:2px}
    .scope-chip .icon{width:13px;height:13px}
    .list-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 22px 9px;color:#9ba39d;font-size:10px;letter-spacing:.4px}
    .list-heading .count{font-variant-numeric:tabular-nums}
    .conversation-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d9dedb transparent;padding:0 9px 12px}
    .conversation{display:flex;align-items:center;gap:11px;width:100%;padding:14px 12px;min-height:77px;border-radius:8px;text-align:left;position:relative;margin:2px 0}
    .conversation:hover{background:#edf0ed}
    .conversation.selected{background:#e1ebe3}
    .avatar{width:43px;height:43px;border-radius:10px;flex:0 0 43px;background:#e0ebe4;color:#58725f;display:grid;place-items:center;overflow:hidden;font-size:17px;font-weight:600;position:relative}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .avatar .icon{width:22px;height:22px;stroke-width:1.5}
    .avatar.self{background:#d4e9d7;color:#53775b}
    .avatar.small{width:35px;height:35px;flex-basis:35px;border-radius:8px;font-size:13px}
    .avatar.large{width:48px;height:48px;flex-basis:48px;border-radius:12px}
    .conversation-copy{min-width:0;flex:1}
    .conversation-top{display:flex;align-items:center;gap:7px}
    .conversation-name{font-weight:550;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .conversation-time{font-size:10px;color:#9aa29c;flex-shrink:0;font-variant-numeric:tabular-nums}
    .conversation-snippet{font-size:11px;color:#8b958d;margin-top:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4;min-height:15px}
    .unread{position:absolute;left:43px;top:10px;background:#ed685f;border:2px solid var(--sidebar);color:#fff;border-radius:10px;font-size:9px;min-width:17px;padding:1px 3px;text-align:center}
    .result{padding:14px 12px;border-bottom:1px solid #e9ede9;margin:0;border-radius:6px}
    .result .avatar{width:35px;height:35px;flex-basis:35px;border-radius:8px;font-size:13px;align-self:flex-start;margin-top:2px}
    .result .conversation-snippet{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;max-height:54px;margin-top:6px;line-height:1.65;color:#66736a}
    .result-sender{margin-top:5px;color:#99a29b;font-size:10px}
    mark{background:#d4edd8;color:#20663a;padding:0 1px;border-radius:2px}
    .load-list{display:block;margin:12px auto 2px;padding:9px 16px;color:#678470;font-size:11px;border-radius:6px;background:#edf2ee}
    .list-empty{padding:54px 23px;color:#98a099;text-align:center;font-size:12px;line-height:1.85}
    .list-empty .icon{width:28px;height:28px;margin:0 auto 13px;color:#bdc6bf;stroke-width:1.3}
    .sidebar-footer{border-top:1px solid var(--line);padding:13px 19px 15px;display:flex;align-items:center;gap:6px;font-size:10px;color:#97a199;white-space:nowrap}
    .sidebar-footer .icon{width:12px;height:12px;color:#89998e}
    .room{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:#f4f5f3}
    .room-header{height:91px;flex-shrink:0;display:flex;align-items:center;padding:0 30px;gap:13px;border-bottom:1px solid #e2e7e1;background:#f8f9f7}
    .room-heading{min-width:0;flex:1}
    .room-heading h2{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
    .room-subtitle{font-size:11px;color:#8f9991;margin-top:4px}
    .room-actions{display:flex;gap:7px;margin-left:14px}
    .room-actions .icon-button{width:35px;height:35px}
    .room-actions .icon{width:19px;height:19px}
    .mobile-back{display:none}
    .filter-summary{display:flex;align-items:center;gap:8px;padding:10px 30px;border-bottom:1px solid #e1e9de;background:#edf3e9;color:#678360;font-size:11px;flex-shrink:0}
    .filter-summary .icon{width:14px;height:14px}
    .filter-summary span{flex:1}
    .text-button{padding:3px 0;color:var(--green-dark);font-size:11px;text-decoration:none}
    .text-button:hover{text-decoration:underline}
    .messages-shell{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
    .message-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 32px 30px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d3dad2 transparent;scroll-behavior:auto}
    .load-earlier-wrap{text-align:center;min-height:34px;margin:2px 0 12px}
    .load-earlier{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;color:#81917f;font-size:11px;border-radius:7px;background:#ebeee8}
    .load-earlier:hover{background:#e3e9df}
    .load-earlier .icon{width:13px;height:13px}
    .history-boundary{color:#a7afa4;font-size:10px;letter-spacing:.2px;padding:9px 0}
    .day-divider{text-align:center;margin:22px 0 25px;font-size:10px;color:#a1aaa0;display:flex;align-items:center;justify-content:center;gap:14px}
    .day-divider:before,.day-divider:after{content:"";width:37px;height:1px;background:#e3e7df}
    .message{display:flex;align-items:flex-start;gap:10px;margin:0 0 20px;max-width:100%;scroll-margin-block:80px}
    .message.self{flex-direction:row-reverse}
    .message-main{max-width:min(72%,660px);min-width:0}
    .message.self .message-main{display:flex;flex-direction:column;align-items:flex-end}
    .message-byline{display:flex;align-items:center;gap:8px;margin:0 2px 6px;min-height:13px;font-size:10px;color:#9aa496;line-height:1.3}
    .message.self .message-byline{flex-direction:row-reverse}
    .sender{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#808d7c}
    .message-time{font-variant-numeric:tabular-nums;font-size:9px;color:#a7aea2}
    .direction-label{font-size:9px;color:#a0a38a}
    .bubble{border-radius:4px 11px 11px 11px;background:#fff;padding:11px 14px;box-shadow:0 1px 1px #16261905;position:relative;min-width:30px;max-width:100%;line-height:1.75;font-size:13px;letter-spacing:.1px;overflow-wrap:anywhere}
    .message.self .bubble{background:var(--bubble);border-radius:11px 4px 11px 11px}
    .message.direction-unknown .bubble{background:#f9faf7;border:1px dashed #d6ddd1;box-shadow:none}
    .message.focused .bubble{animation:focus-ring 2.6s ease-out}
    @keyframes focus-ring{0%,35%{box-shadow:0 0 0 4px #30b56765}100%{box-shadow:0 0 0 0 #30b56700}}
    .message-text{white-space:pre-wrap;word-break:break-word}
    .message-text a{color:#28744e;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
    .message.self .message-text a{color:#225334}
    .message-caption{margin-top:10px}
    .media-frame{max-width:360px;overflow:hidden;border-radius:8px;position:relative;background:#eef1eb;display:block;border:1px solid #00000004;padding:0}
    .media-image{display:block;max-width:100%;max-height:340px;object-fit:contain;min-width:100px;min-height:90px;cursor:zoom-in}
    .media-note{display:block;margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}
    .message.self .bubble:has(.media-frame),.bubble:has(.media-frame){padding:5px}
    .bubble:has(.media-frame) .message-caption{padding:0 9px 6px}
    .media-frame video{display:block;max-width:100%;width:330px;max-height:340px;background:#26332b}
    .audio-wrap{display:flex;flex-direction:column;gap:8px;max-width:290px}
    .audio-label{display:flex;gap:6px;align-items:center;font-size:11px;color:#6b7e66}
    .audio-label .icon{width:15px;height:15px}
    audio{width:270px;max-width:100%;height:36px}
    .attachment{display:flex;align-items:center;gap:12px;min-width:190px;max-width:300px;color:inherit;text-decoration:none;padding:3px 0}
    .attachment-icon{width:39px;height:44px;flex:0 0 39px;border-radius:6px;background:#f0f3ed;color:#91a785;display:grid;place-items:center}
    .attachment-icon .icon{width:23px;height:23px}
    .attachment-copy{min-width:0;flex:1}
    .attachment-name{font-size:12px;line-height:1.6;overflow-wrap:anywhere}
    .attachment-meta{margin-top:4px;font-size:10px;color:#a0aa9a}
    a.attachment:hover .attachment-name{text-decoration:underline}
    .message.self .attachment-icon{background:#ffffff55;color:#598b40}
    .message.self .attachment-meta{color:#6c9255}
    .unavailable-media{display:flex;align-items:center;gap:9px;font-size:12px;color:#91a087;padding:7px 0}
    .unavailable-media .icon{width:23px;height:23px}
    .unavailable-media small{display:block;font-size:10px;color:#a3ada0;margin-top:2px}
    .system-message{text-align:center;margin:15px auto 22px;max-width:80%;font-size:10px;line-height:1.7;color:#a1ab9b;overflow-wrap:anywhere}
    .message-empty{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:45vh;gap:10px;text-align:center;color:#9ba796;font-size:12px}
    .message-empty .icon{width:32px;height:32px;stroke-width:1.25;color:#bec8b8}
    .message-error{margin:14px 0;padding:15px;border:1px solid #e9dfc9;border-radius:8px;background:#faf6ed;color:#8e7951;font-size:12px;line-height:1.7;text-align:center}
    .message-error button{display:block;margin:8px auto 0;color:#74603e;text-decoration:underline}
    .room-footer{height:49px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 31px;border-top:1px solid #e2e7df;background:#f8f9f6;font-size:10px;color:#9da697}
    .footer-note{display:flex;align-items:center;gap:6px}
    .footer-note .icon{width:12px;height:12px}
    .footer-loaded{font-variant-numeric:tabular-nums;text-align:right}
    .jump-bottom{position:absolute;right:26px;bottom:20px;width:37px;height:37px;border-radius:50%;background:#fff;color:#7c9272;border:1px solid #e2e8dd;box-shadow:0 3px 14px #2032190a;display:grid;place-items:center;z-index:2}
    .jump-bottom:hover{background:#edf5e8}
    .jump-bottom .icon{width:19px;height:19px}
    .welcome{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:45px;background:radial-gradient(ellipse at 63% 44%,#eff4eb 0,transparent 63%)}
    .welcome-inner{max-width:520px;width:100%;text-align:center;margin-top:-26px}
    .welcome-art{position:relative;width:115px;height:111px;margin:0 auto 30px}
    .welcome-art:before{content:"";position:absolute;inset:8px 0 0;border-radius:40px;background:#e4eddf;transform:rotate(-12deg)}
    .welcome-art .icon{position:absolute;left:23px;top:25px;width:69px;height:69px;stroke:#7f9f73;stroke-width:1.1}
    .welcome-art .mini-lock{position:absolute;right:-1px;bottom:5px;width:31px;height:31px;border-radius:50%;background:#f8faf6;border:3px solid #edf3e8;display:grid;place-items:center}
    .welcome-art .mini-lock .icon{position:static;width:15px;height:15px;stroke-width:1.8;stroke:#719662}
    .eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9baa91;margin:0 0 13px}
    .welcome h2{font-size:25px;letter-spacing:.5px;font-weight:550;color:#586a51;margin:0 0 13px;line-height:1.5}
    .welcome-description{color:#99a590;font-size:12px;line-height:2;max-width:400px;margin:0 auto}
    .welcome-stats{display:flex;align-items:flex-start;justify-content:center;margin:31px auto 0;gap:0}
    .welcome-stat{padding:0 23px;min-width:100px}
    .welcome-stat+.welcome-stat{border-left:1px solid #dfe7d8}
    .welcome-stat strong{display:block;font-size:21px;font-weight:500;letter-spacing:-.4px;color:#6e8561;font-variant-numeric:tabular-nums;line-height:1.3}
    .welcome-stat span{display:block;font-size:10px;color:#a1ad96;margin-top:6px}
    .welcome-actions{margin:24px auto 0;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;border:1px solid #dce5d7;border-radius:7px;padding:8px 15px;background:#fff;color:#69805e;font-size:12px;line-height:1.3}
    .button .icon{width:15px;height:15px}
    .button:hover{background:#f0f6eb}
    .button.primary{background:#078e50;color:white;border-color:#078e50}
    .button.primary:hover{background:#057740}
    .welcome-footnote{color:#b1bbaa;font-size:10px;margin:24px 0 0;line-height:1.8}
    .welcome-error{margin:17px auto 0;max-width:390px;color:#a79575;font-size:11px;line-height:1.8}
    .welcome-source-notes{margin:20px auto 0;max-width:420px;padding:15px 18px;border:1px solid #e6e4d4;border-radius:9px;background:#f8f8ee;text-align:left;color:#96947a;font-size:11px;line-height:1.8;overflow-wrap:anywhere}
    .welcome-source-notes p{margin:0}
    .welcome-source-notes p+p{margin-top:8px}
    .skeleton{height:70px;margin:4px 9px;display:flex;align-items:center;gap:12px;padding:10px 5px}
    .skeleton-avatar{height:42px;width:42px;border-radius:9px;background:#edf0ed}
    .skeleton-copy{flex:1}
    .skeleton-line{height:9px;border-radius:3px;background:#e8ede8;width:55%;margin:8px 0}
    .skeleton-line:last-child{width:85%;opacity:.65}
    .skeleton{animation:pulse 1.6s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.45}}
    .spinning{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    dialog{border:1px solid #e2e9df;border-radius:15px;padding:0;max-width:calc(100vw - 36px);width:480px;max-height:calc(100dvh - 50px);color:var(--ink);background:#fafcf9;box-shadow:0 24px 100px #1c32132e}
    dialog::backdrop{background:#1f2b2542;backdrop-filter:blur(4px)}
    .dialog-heading{padding:22px 23px 17px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #e5eae2}
    .dialog-heading>.icon{color:#7a9570;width:21px;height:21px}
    .dialog-heading h2{margin:0;font-size:16px;font-weight:600;flex:1}
    .dialog-heading .icon-button{width:27px;height:27px}
    .dialog-heading .icon-button .icon{width:17px;height:17px}
    .dialog-body{padding:22px 25px;overflow:auto;max-height:calc(100dvh - 210px)}
    .dialog-intro{font-size:12px;line-height:1.9;color:#8c9a84;margin:0 0 20px}
    .status-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:6px 9px;border-radius:5px;background:#e8f4e8;color:#659358;margin-bottom:19px}
    .status-badge.waiting{background:#f5efdf;color:#a28a57}
    .status-badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .status-grid{margin:0;display:grid;grid-template-columns:90px minmax(0,1fr);column-gap:18px;row-gap:13px;font-size:12px;line-height:1.65}
    .status-grid dt{color:#95a18b}
    .status-grid dd{margin:0;color:#586850;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .status-notes{margin:22px 0 0;padding:15px 16px;border-radius:8px;background:#f0f4ec;font-size:11px;line-height:1.85;color:#91a083}
    .status-notes p{margin:0}
    .status-notes p+p{margin-top:8px}
    .capabilities{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
    .capability{border:1px solid #e0e8db;border-radius:5px;padding:4px 7px;color:#8c9d7f;font-size:10px}
    .dialog-footer{display:flex;justify-content:flex-end;gap:9px;padding:17px 24px 21px;border-top:1px solid #e5eae2}
    .date-dialog{width:360px}
    .field-label{display:block;font-size:11px;color:#8a9980;margin:0 0 9px}
    .date-input{width:100%;height:43px;background:white;border:1px solid #dce5d5;border-radius:7px;padding:0 11px;color:#4f6746;accent-color:#0a9b58}
    .field-hint{font-size:10px;line-height:1.8;color:#a2ad9a;margin:11px 0 0}
    .export-choices{display:flex;flex-direction:column;gap:10px}

        $('search-input').value = ''; document.querySelectorAll('[data-kind]').forEach(function (b) { const active = b.dataset.kind === 'all'; b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active)); });
        clearMessageState(); renderStatus(); renderSidebarMode(); await loadConversations(false);
        $('status-dialog').close(); showToast('已导入 ' + num(local.messages.length) + ' 条消息、' + num(local.conversations.length) + ' 个会话');
      } catch (error) { showToast(error.message || '导入失败'); }
      finally { importButtons.forEach(function (b) { b.disabled = false; }); $('json-file').value = ''; }
    }
    function fileName(name, ext) { return (text(name, '微信会话').replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_').slice(0, 90) || '微信会话') + '_' + dateKey(new Date()) + '.' + ext; }
    function download(blob, name) {
      const url = URL.createObjectURL(blob); const a = node('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }
    async function exportConversation(format) {
      const selected = state.selected; const cid = state.selectedId; if (!selected || !cid) return;
      const buttons = [$('export-json'), $('export-txt')]; buttons.forEach(function (b) { b.disabled = true; });
      try {
        let blob;
        if (state.mode === 'file') {
          const messages = state.local.byConversation.get(cid) || [];
          if (format === 'json') blob = new Blob([JSON.stringify({ schema: 'wechat-local-viewer.v1', account_label: state.status.account_label, exported_at: new Date().toISOString(), conversation: selected, messages: messages }, null, 2)], { type: 'application/json;charset=utf-8' });
          else {
            const lines = [text(selected.name, cid), '本地聊天记录导出', '消息数：' + messages.length, ''];
            messages.forEach(function (m) { lines.push(fullDate(m.timestamp) + '  ' + text(m.sender_name, m.is_self ? '我' : '未知联系人'), preview(m) + (m.file_name ? '\n附件：' + text(m.file_name) : ''), ''); });
            blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
          }
        } else {
          const response = await fetch(apiQuery('/api/export', { conversation_id: cid, format: format }), { credentials: 'same-origin', cache: 'no-store' });
          if (!response.ok) throw new Error(response.status === 401 || response.status === 403 ? '本地授权已失效，请重新打开启动地址后导出。' : '导出失败（' + response.status + '），请稍后重试。');
          blob = await response.blob();
        }
        download(blob, fileName(selected.name, format)); $('export-dialog').close(); showToast('已生成所选会话的 ' + format.toUpperCase() + ' 文件');
      } catch (error) { showToast(error.message || '导出失败'); }
      finally { buttons.forEach(function (b) { b.disabled = false; }); }
    }
    function searchCurrent() {
      if (!state.selectedId) return;
      state.query = ''; $('search-input').value = ''; setSidebarMode('messages', state.selectedId);
      $('app').classList.remove('room-open'); $('search-input').focus();
    }
    function showStatus() { renderStatus(); showDialog($('status-dialog')); }
    function resetToLatest() { if (state.selected) selectConversation(state.selected); }

    $('nav-chats').addEventListener('click', function () { setSidebarMode('conversations'); $('app').classList.remove('room-open'); });
    $('nav-search').addEventListener('click', function () { setSidebarMode('messages', ''); $('app').classList.remove('room-open'); $('search-input').focus(); });
    $('mode-conversations').addEventListener('click', function () { setSidebarMode('conversations'); });
    $('mode-messages').addEventListener('click', function () { setSidebarMode('messages'); });
    $('search-input').addEventListener('input', function () {
      state.query = this.value; $('clear-search').hidden = !state.query; clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.sidebarMode === 'messages' ? loadSearch(false) : loadConversations(false); }, 260);
    });
    $('search-input').addEventListener('keydown', function (event) { if (event.key === 'Enter') { clearTimeout(searchTimer); state.sidebarMode === 'messages' ? loadSearch(false) : loadConversations(false); } });
    $('clear-search').addEventListener('click', function (event) { event.preventDefault(); state.query = ''; $('search-input').value = ''; clearTimeout(searchTimer); renderSidebarMode(); state.sidebarMode === 'messages' ? loadSearch(false) : loadConversations(false); $('search-input').focus(); });
    $('clear-scope').addEventListener('click', function () { state.searchIn = ''; renderSidebarMode(); loadSearch(false); });
    document.querySelectorAll('[data-kind]').forEach(function (button) {
      button.addEventListener('click', function () { state.kind = button.dataset.kind; document.querySelectorAll('[data-kind]').forEach(function (b) { const active = b.dataset.kind === state.kind; b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active)); }); loadConversations(false); });
    });
    [$('status-button'), $('sidebar-info'), $('room-info')].forEach(function (b) { b.addEventListener('click', showStatus); });
    [$('refresh-button'), $('welcome-connect')].forEach(function (b) { b.addEventListener('click', function () { connect(false); }); });
    $('status-refresh').addEventListener('click', function () { $('status-dialog').close(); connect(false); });
    [$('import-button'), $('welcome-import'), $('status-import')].forEach(function (b) { b.addEventListener('click', function () { $('json-file').click(); }); });
    $('json-file').addEventListener('change', function () { importFile(this.files && this.files[0]); });
    $('mobile-back').addEventListener('click', function () { $('app').classList.remove('room-open'); });
    $('search-conversation').addEventListener('click', searchCurrent);
    $('date-button').addEventListener('click', function () { $('date-input').value = state.date || dateKey(state.messages.length ? state.messages[state.messages.length - 1].timestamp : new Date()); showDialog($('date-dialog')); });
    $('date-form').addEventListener('submit', function (event) { event.preventDefault(); const date = $('date-input').value; if (date && state.selected) { $('date-dialog').close(); selectConversation(state.selected, { date: date }); } });
    $('clear-date').addEventListener('click', function () { $('date-dialog').close(); resetToLatest(); });
    $('show-latest').addEventListener('click', resetToLatest);
    $('export-button').addEventListener('click', function () { $('export-description').textContent = '保存“' + text(state.selected && state.selected.name, '当前会话') + '”的本地聊天记录。'; showDialog($('export-dialog')); });
    $('export-json').addEventListener('click', function () { exportConversation('json'); });
    $('export-txt').addEventListener('click', function () { exportConversation('txt'); });
    $('jump-bottom').addEventListener('click', scrollBottom);
    $('message-scroll').addEventListener('scroll', updateJumpButton, { passive: true });
    $('media-dialog').addEventListener('close', function () { $('media-dialog-body').replaceChildren(); });
    document.querySelectorAll('[data-close-dialog]').forEach(function (button) { button.addEventListener('click', function () { button.closest('dialog').close(); }); });
    document.querySelectorAll('dialog').forEach(function (dialog) {
      dialog.addEventListener('click', function (event) { if (event.target !== dialog) return; const r = dialog.getBoundingClientRect(); if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) dialog.close(); });
    });
    document.addEventListener('keydown', function (event) {
      if (document.querySelector('dialog[open]')) return;
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); $('app').classList.remove('room-open'); $('search-input').focus(); $('search-input').select(); }
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f' && state.selectedId) { event.preventDefault(); searchCurrent(); }
      if (event.key === 'Escape' && window.matchMedia('(max-width:620px)').matches && $('app').classList.contains('room-open')) $('app').classList.remove('room-open');
    });
    window.addEventListener('resize', updateJumpButton, { passive: true });
    renderSkeletons(); renderStatus(); connect(true);
  }());
  </script>
</body>
</html>
